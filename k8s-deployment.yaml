apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudtech-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudtech
  template:
    metadata:
      labels:
        app: cloudtech
    spec:
      containers:
      - name: cloudtech-container
        image: cloudtech-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: cloudtech-service
spec:
  type: NodePort
  selector:
    app: cloudtech
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30300
